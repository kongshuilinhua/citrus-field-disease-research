# [28] YOLOV8-CMS 柑橘叶病分类 —— 重建版模型定义(分类)
# 改动：C2f -> CSPPC(CSP+PartialConv)；P2 下采样用 SpatialConv；主干末加 MultiDimen 多维注意力。
# ⚠ 论文仅给出模块名称、细节未公开，此为最低保真度重建。需先 register() 注册模块。
nc: 12
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  l: [1.00, 1.00, 1024]
  x: [1.00, 1.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, SpatialConv, [128, 3, 2]]  # 1-P2/4  (SpatialConv 下采样)
  - [-1, 3, CSPPC, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, CSPPC, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 6, CSPPC, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 3, CSPPC, [1024, True]]       # 8
  - [-1, 1, MultiDimen, [1024]]        # 9  多维注意力(通道保持)

head:
  - [-1, 1, Classify, [nc]]            # 10  Classify
